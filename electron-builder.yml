appId: pl.meow.launcher
productName: Meow Launcher
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!{src,tests,examples,docs}/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig}'
  - '!{README.md,AGENTS.md,CHANGELOG.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.tests.json}'
asarUnpack:
  - resources/**
win:
  executableName: meowlauncher
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Łukasz Wolny
  category: Game
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
